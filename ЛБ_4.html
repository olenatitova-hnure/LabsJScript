<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин книг</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f8;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .tabs-container {
      max-width: 1050px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .tabs-nav {
      display: flex;
      background-color: #e9ecef;
      border-bottom: 2px solid #dee2e6;
    }

    .tab-button {
      padding: 12px 24px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #495057;
      transition: background-color 0.2s, color 0.2s;
      outline: none;
    }

    .tab-button:hover {
      background-color: #ced4da;
    }

    .tab-button.active {
      background-color: #007bff;
      color: #ffffff;
    }

    .tab-content {
      display: none;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .tab-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-add {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #218838;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #dee2e6;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: #f8f9fa;
      color: #212529;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .editable-cell {
      cursor: pointer;
      position: relative;
    }

    .editable-cell:hover {
      background-color: #e8f4fe;
      outline: 1px dashed #007bff;
    }

    .cell-input, .cell-select {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid #007bff;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      transition: background-color 0.2s;
    }

    .btn-delete:hover {
      background-color: #bd2130;
    }

    th.action-col, td.action-col {
      text-align: center;
      width: 50px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }

    .close-btn:hover {
      color: #000;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="date"],
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .form-group.checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group.checkbox-group label {
      margin-bottom: 0;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-submit {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #0056b3;
    }

    .btn-cancel {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background-color: #5a6268;
    }

    .error-modal {
      border-left: 5px solid #dc3545;
    }

    .error-modal h3 {
      color: #dc3545;
    }
  </style>
</head>
<body>

  <h1>Система управління мережею книжкових магазинів</h1>

  <div class="tabs-container">
    <div class="tabs-nav">
      <button class="tab-button active" onclick="openTab(event, 'books-tab')">Книги</button>
      <button class="tab-button" onclick="openTab(event, 'employees-tab')">Співробітники</button>
      <button class="tab-button" onclick="openTab(event, 'stores-tab')">Магазини</button>
    </div>

    <div id="books-tab" class="tab-content active">
      <div class="tab-header-actions">
        <h2>Список книг</h2>
        <button class="btn-add" onclick="openModal('books')">+ Додати книгу</button>
      </div>
      <div id="books-table-container"></div>
    </div>

    <div id="employees-tab" class="tab-content">
      <div class="tab-header-actions">
        <h2>Список співробітників</h2>
        <button class="btn-add" onclick="openModal('employees')">+ Додати співробітника</button>
      </div>
      <div id="employees-table-container"></div>
    </div>

    <div id="stores-tab" class="tab-content">
      <div class="tab-header-actions">
        <h2>Список магазинів</h2>
        <button class="btn-add" onclick="openModal('stores')">+ Додати магазин</button>
      </div>
      <div id="stores-table-container"></div>
    </div>
  </div>

  <!-- Модальне вікно додавання -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Додати запис</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="dynamic-form" onsubmit="handleFormSubmit(event)">
        <div id="form-fields"></div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Скасувати</button>
          <button type="submit" class="btn-submit">Зберегти</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальне вікно помилки -->
  <div id="error-modal-overlay" class="modal-overlay">
    <div class="modal-content error-modal">
      <div class="modal-header">
        <h3>Помилка видалення!</h3>
        <button class="close-btn" onclick="closeErrorModal()">&times;</button>
      </div>
      <p id="error-modal-message">Ці дані використовуються в іншій таблиці, тому наразі видалити їх неможливо.</p>
      <div class="form-actions">
        <button type="button" class="btn-submit" onclick="closeErrorModal()">Зрозуміло</button>
      </div>
    </div>
  </div>

  <script>
    // Початкові дефолтні дані
    const defaultBooks = [
      { id: "BK-001", name: "Кобзар", author: "Тарас Шевченко", price: 350, storeAddress: "вул. Хрещатик, 10" },
      { id: "BK-002", name: "Тіні забутих предків", author: "Михайло Коцюбинський", price: 280, storeAddress: "просп. Науки, 15" },
      { id: "BK-003", name: "Місто", author: "Валеріян Підмогильний", price: 310, storeAddress: "вул. Хрещатик, 10" }
    ];

    const defaultEmployees = [
      { fullName: "Іваненко Іван Іванович", position: "Продавець", hireDate: "2021-05-12", onVacation: false, storeAddress: "вул. Хрещатик, 10" },
      { fullName: "Петренко Олена Сергіївна", position: "Бухгалтер", hireDate: "2019-03-01", onVacation: true, storeAddress: "вул. Хрещатик, 10" },
      { fullName: "Сидоренко Василь Петрович", position: "Охоронець", hireDate: "2022-11-10", onVacation: false, storeAddress: "просп. Науки, 15" }
    ];

    const defaultStores = [
      { name: "Книжковий Рай - Центр", address: "вул. Хрещатик, 10", hasBookcrossing: true, hasReadingRoom: true },
      { name: "Книжковий Рай - Академічний", address: "просп. Науки, 15", hasBookcrossing: true, hasReadingRoom: false },
      { name: "Книжковий Рай - Поділ", address: "вул. Сагайдачного, 22", hasBookcrossing: false, hasReadingRoom: true }
    ];

    // Робочі масиви даних
    let booksData = [];
    let employeesData = [];
    let storesData = [];

    let currentEntity = null;

    // --- 1. Логіка роботи з localStorage та синхронізація між вкладками ---

    function saveDataToLocalStorage() {
      let state = {
        books: booksData,
        employees: employeesData,
        stores: storesData
      };
      localStorage.setItem('bookstore_data', JSON.stringify(state));
    }

    function loadDataFromLocalStorage() {
      let saved = localStorage.getItem('bookstore_data');
      if (saved) {
        try {
          let parsed = JSON.parse(saved);
          booksData = parsed.books || [];
          employeesData = parsed.employees || [];
          storesData = parsed.stores || [];
        } catch(e) {
          useDefaultData();
        }
      } else {
        useDefaultData();
      }
    }

    function useDefaultData() {
      booksData = JSON.parse(JSON.stringify(defaultBooks));
      employeesData = JSON.parse(JSON.stringify(defaultEmployees));
      storesData = JSON.parse(JSON.stringify(defaultStores));
      saveDataToLocalStorage();
    }

    // Автоматична синхронізація при змінах в інших вкладках
    window.addEventListener('storage', function(e) {
      if (e.key === 'bookstore_data') {
        loadDataFromLocalStorage();
        renderAllTables();
      }
    });

    // --- 2. Конфігурації та приєднання зв'язаного списку (<select>) ---

    function getStoreAddresses() {
      let addresses = [];
      for (let i = 0; i < storesData.length; i++) {
        addresses.push(storesData[i].address);
      }
      return addresses;
    }

    function getEntityConfigs() {
      let currentStoreAddresses = getStoreAddresses();

      return {
        books: {
          title: "Додати нову книгу",
          fields: [
            { name: "id", label: "Код товару", type: "text", required: true },
            { name: "name", label: "Назва", type: "text", required: true },
            { name: "author", label: "Автор", type: "text", required: true },
            { name: "price", label: "Ціна (грн)", type: "number", required: true },
            // Поле прив'язане у вигляді випадного списку до сутності "Магазини"
            { name: "storeAddress", label: "Адреса магазина", type: "select", options: currentStoreAddresses, required: true }
          ]
        },
        employees: {
          title: "Додати нового співробітника",
          fields: [
            { name: "fullName", label: "ПІБ", type: "text", required: true },
            { name: "position", label: "Посада", type: "select", options: ["Продавець", "Бухгалтер", "Касир", "Охоронець"], required: true },
            { name: "hireDate", label: "Дата найму", type: "date", required: true },
            { name: "onVacation", label: "У відпустці", type: "checkbox" },
            // Поле прив'язане у вигляді випадного списку до сутності "Магазини"
            { name: "storeAddress", label: "Адреса магазина", type: "select", options: currentStoreAddresses, required: true }
          ]
        },
        stores: {
          title: "Додати новий магазин",
          fields: [
            { name: "name", label: "Назва", type: "text", required: true },
            { name: "address", label: "Адреса магазина", type: "text", required: true },
            { name: "hasBookcrossing", label: "Наявність буккросінгу", type: "checkbox" },
            { name: "hasReadingRoom", label: "Наявність читального залу", type: "checkbox" }
          ]
        }
      };
    }

    // --- 3. Генерація таблиць ---

    function createTable(headers, data, keys, entityType) {
      let table = document.createElement('table');
      let thead = document.createElement('thead');
      let tbody = document.createElement('tbody');

      let headerRow = document.createElement('tr');
      for (let i = 0; i < headers.length; i++) {
        let th = document.createElement('th');
        th.textContent = headers[i];
        headerRow.appendChild(th);
      }
      
      let actionTh = document.createElement('th');
      actionTh.className = 'action-col';
      actionTh.textContent = 'Дії';
      headerRow.appendChild(actionTh);
      thead.appendChild(headerRow);

      for (let i = 0; i < data.length; i++) {
        let row = document.createElement('tr');
        let item = data[i];

        for (let j = 0; j < keys.length; j++) {
          let td = document.createElement('td');
          let key = keys[j];
          let val = item[key];

          if (typeof val === 'boolean') {
            td.textContent = val ? 'Так' : 'Ні';
            td.className = 'editable-cell';
            td.onclick = function() {
              item[key] = !item[key];
              saveDataToLocalStorage();
              renderAllTables();
            };
          } else {
            td.textContent = val;
            td.className = 'editable-cell';
            td.onclick = function() {
              makeCellEditable(td, item, key, entityType);
            };
          }

          row.appendChild(td);
        }

        let actionTd = document.createElement('td');
        actionTd.className = 'action-col';
        let deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.title = 'Видалити рядок';
        deleteBtn.onclick = function(e) {
          e.stopPropagation();
          deleteRow(entityType, i);
        };

        actionTd.appendChild(deleteBtn);
        row.appendChild(actionTd);
        tbody.appendChild(row);
      }

      table.appendChild(thead);
      table.appendChild(tbody);
      return table;
    }

    // --- 4. Інтерактивне редагування комірки (включаючи <select> для прив'язаних полів) ---

    function makeCellEditable(td, item, key, entityType) {
      if (td.querySelector('input') || td.querySelector('select')) return;

      let oldValue = item[key];
      td.innerHTML = '';

      let input;
      let isSaved = false;

      function saveValue() {
        if (isSaved) return;
        isSaved = true;

        let newValue = input.value.trim();

        if (newValue !== '') {
          if (key === 'price') {
            item[key] = parseFloat(newValue);
          } else {
            item[key] = newValue;
          }
          saveDataToLocalStorage();
        }

        renderAllTables();
      }

      // Якщо редагуємо "Адреса магазина" — показуємо випадний список із наявних магазинів
      if (key === 'storeAddress') {
        input = document.createElement('select');
        input.className = 'cell-select';
        let addresses = getStoreAddresses();

        for (let i = 0; i < addresses.length; i++) {
          let opt = document.createElement('option');
          opt.value = addresses[i];
          opt.textContent = addresses[i];
          if (addresses[i] === oldValue) {
            opt.selected = true;
          }
          input.appendChild(opt);
        }

        input.onchange = function() { saveValue(); };
        input.onblur = function() { saveValue(); };
      } else {
        input = document.createElement('input');
        input.className = 'cell-input';
        input.type = (key === 'price') ? 'number' : ((key === 'hireDate') ? 'date' : 'text');
        input.value = oldValue;

        input.onkeydown = function(e) {
          if (e.key === 'Enter') saveValue();
        };
        input.onblur = function() { saveValue(); };
      }

      td.appendChild(input);
      input.focus();
    }

    // --- 5. Видалення рядка ---

    function deleteRow(entityType, index) {
      if (entityType === 'stores') {
        let storeToDelete = storesData[index];
        
        let hasLinkedEmployees = employeesData.some(emp => emp.storeAddress === storeToDelete.address);
        let hasLinkedBooks = booksData.some(book => book.storeAddress === storeToDelete.address);

        if (hasLinkedEmployees || hasLinkedBooks) {
          let reason = [];
          if (hasLinkedEmployees) reason.push("є співробітники, які там працюють");
          if (hasLinkedBooks) reason.push("у ньому перебувають книги");

          showErrorModal(`Неможливо видалити магазин "${storeToDelete.name}" (${storeToDelete.address}), оскільки ${reason.join(" та ")}.`);
          return;
        }

        storesData.splice(index, 1);
      } else if (entityType === 'books') {
        booksData.splice(index, 1);
      } else if (entityType === 'employees') {
        employeesData.splice(index, 1);
      }

      saveDataToLocalStorage();
      renderAllTables();
    }

    // --- 6. Рендеринг таблиць ---

    function renderAllTables() {
      let booksContainer = document.getElementById('books-table-container');
      booksContainer.innerHTML = '';
      let booksHeaders = ["Код товару", "Назва", "Автор", "Ціна (грн)", "Адреса магазина"];
      let booksKeys = ["id", "name", "author", "price", "storeAddress"];
      booksContainer.appendChild(createTable(booksHeaders, booksData, booksKeys, 'books'));

      let empContainer = document.getElementById('employees-table-container');
      empContainer.innerHTML = '';
      let empHeaders = ["ПІБ", "Посада", "Дата найму", "Відпустка", "Адреса магазина"];
      let empKeys = ["fullName", "position", "hireDate", "onVacation", "storeAddress"];
      empContainer.appendChild(createTable(empHeaders, employeesData, empKeys, 'employees'));

      let storesContainer = document.getElementById('stores-table-container');
      storesContainer.innerHTML = '';
      let storesHeaders = ["Назва", "Адреса магазина", "Наявність буккросінгу", "Наявність читального залу"];
      let storesKeys = ["name", "address", "hasBookcrossing", "hasReadingRoom"];
      storesContainer.appendChild(createTable(storesHeaders, storesData, storesKeys, 'stores'));
    }

    // --- 7. Навігація табів ---

    function openTab(event, tabId) {
      let tabContents = document.querySelectorAll('.tab-content');
      for (let i = 0; i < tabContents.length; i++) {
        tabContents[i].classList.remove('active');
      }

      let tabButtons = document.querySelectorAll('.tab-button');
      for (let i = 0; i < tabButtons.length; i++) {
        tabButtons[i].classList.remove('active');
      }

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // --- 8. Модальне вікно додавання ---

    function openModal(entityType) {
      currentEntity = entityType;
      let configs = getEntityConfigs();
      let config = configs[entityType];

      document.getElementById('modal-title').textContent = config.title;
      let fieldsContainer = document.getElementById('form-fields');
      fieldsContainer.innerHTML = '';

      // Перевірка на випадок додавання книги/співробітника, якщо немає створених магазинів
      if ((entityType === 'books' || entityType === 'employees') && config.fields.find(f => f.name === 'storeAddress').options.length === 0) {
        showErrorModal("Спочатку потрібно додати хоча б один магазин у відповідній таблиці!");
        return;
      }

      for (let i = 0; i < config.fields.length; i++) {
        let field = config.fields[i];
        let group = document.createElement('div');
        group.className = 'form-group';

        let label = document.createElement('label');
        label.textContent = field.label;

        let input;

        if (field.type === 'select') {
          input = document.createElement('select');
          input.name = field.name;
          for (let j = 0; j < field.options.length; j++) {
            let opt = document.createElement('option');
            opt.value = field.options[j];
            opt.textContent = field.options[j];
            input.appendChild(opt);
          }
        } else if (field.type === 'checkbox') {
          group.classList.add('checkbox-group');
          input = document.createElement('input');
          input.type = 'checkbox';
          input.name = field.name;
        } else {
          input = document.createElement('input');
          input.type = field.type;
          input.name = field.name;
          if (field.type === 'number') {
            input.min = "0";
            input.step = "any";
          }
        }

        if (field.required) input.required = true;

        if (field.type === 'checkbox') {
          group.appendChild(input);
          group.appendChild(label);
        } else {
          group.appendChild(label);
          group.appendChild(input);
        }

        fieldsContainer.appendChild(group);
      }

      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('dynamic-form').reset();
      currentEntity = null;
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      let form = event.target;
      let configs = getEntityConfigs();
      let config = configs[currentEntity];
      let newItem = {};

      for (let i = 0; i < config.fields.length; i++) {
        let field = config.fields[i];
        let element = form.elements[field.name];

        if (field.type === 'checkbox') {
          newItem[field.name] = element.checked;
        } else if (field.type === 'number') {
          newItem[field.name] = parseFloat(element.value);
        } else {
          newItem[field.name] = element.value.trim();
        }
      }

      if (currentEntity === 'books') booksData.push(newItem);
      else if (currentEntity === 'employees') employeesData.push(newItem);
      else if (currentEntity === 'stores') storesData.push(newItem);

      saveDataToLocalStorage();
      renderAllTables();
      closeModal();
    }

    function showErrorModal(message) {
      document.getElementById('error-modal-message').textContent = message;
      document.getElementById('error-modal-overlay').classList.add('active');
    }

    function closeErrorModal() {
      document.getElementById('error-modal-overlay').classList.remove('active');
    }

    // Ініціалізація завантаження сторінки
    window.onload = function() {
      loadDataFromLocalStorage();
      renderAllTables();
    };
  </script>

</body>
</html>
